_subdirectory: template

project_name:
  type: str
  help: What is the name of your project?

project_slug:
  type: str
  help: Project slug (directory name)?
  default: '{{project_name|lower|replace(" ", "-")}}'

package_name:
  type: str
  help: What is the name of your python package?
  default: '{{project_slug|replace("-", "_")}}'

description:
  type: str
  help: So ... what are you building?

_message_after_copy: |
    Your project "{{ project_name }}" has been created successfully!

    Next steps:

    1. Change directory:

       $ cd {{ _copier_conf.dst_path }}

    2. Install prek hooks:

       $ prek install

_tasks:
  - command: "git -C {{ project_name }} init"
    when: "{{ _copier_operation == 'copy' }}"
  # - command: "prek install {{ project_name }}"
  #   when: "{{ _copier_operation == 'copy' }}"
  - command: "git -C {{ project_name }} add ."
    when: "{{ _copier_operation == 'copy' }}"
  - command: "git -C {{ project_name }} commit -m 'Project scaffold.'"
    when: "{{ _copier_operation == 'copy' }}"
